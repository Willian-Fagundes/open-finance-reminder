<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Finance Developer Intelligence</title>
    <style>
        body {
            margin: 0;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0b1220;
            color: #e8edf8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: min(980px, 100%);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        header {
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 3vw, 3rem);
            letter-spacing: -0.03em;
        }

        p.subtitle {
            margin: 8px 0 0;
            color: #94a3b8;
        }

        .chat-window {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(148, 163, 184, 0.16);
            border-radius: 20px;
            padding: 18px;
            min-height: 450px;
            max-height: 70vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: inline-flex;
            max-width: 90%;
            padding: 14px 18px;
            border-radius: 18px;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.6;
        }

        .message.user {
            align-self: flex-end;
            background: #1d4ed8;
            color: white;
            border-bottom-right-radius: 6px;
        }

        .message.assistant {
            align-self: flex-start;
            background: #111827;
            color: #e2e8f0;
            border-bottom-left-radius: 6px;
        }

        .form-panel {
            display: grid;
            gap: 12px;
            width: 100%;
        }

        textarea {
            width: 100%;
            min-height: 88px;
            border-radius: 16px;
            border: 1px solid rgba(148, 163, 184, 0.24);
            background: rgba(15, 23, 42, 0.96);
            color: #e2e8f0;
            padding: 14px 16px;
            resize: vertical;
            font-size: 1rem;
            line-height: 1.5;
        }

        button {
            border: none;
            border-radius: 16px;
            padding: 14px 22px;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: transform 120ms ease, box-shadow 120ms ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 30px rgba(14, 165, 233, 0.18);
        }

        .status {
            font-size: 0.95rem;
            color: #94a3b8;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Open Finance Developer Helper</h1>
            <p class="subtitle">Ask a question and get an answer from the agent. Your chat stays in browser session memory.</p>
        </header>

        <div id="chat" class="chat-window"></div>

        <div class="form-panel">
            <form id="chat-form">
                <textarea id="question" placeholder="Type your question and press Enter or click Send..."></textarea>
                <button type="submit">Send</button>
            </form>
            <div id="status" class="status">Session memory is stored in your browser tab.</div>
        </div>
    </div>

    <script>
        const storageKey = "open_finance_chat_history";
        const chatWindow = document.getElementById("chat");
        const form = document.getElementById("chat-form");
        const questionInput = document.getElementById("question");
        const status = document.getElementById("status");

        function createMessageElement(text, role) {
            const message = document.createElement("div");
            message.className = `message ${role}`;
            message.textContent = text;
            return message;
        }

        function saveHistory(history) {
            sessionStorage.setItem(storageKey, JSON.stringify(history));
        }

        function loadHistory() {
            const stored = sessionStorage.getItem(storageKey);
            if (!stored) {
                return [];
            }

            try {
                return JSON.parse(stored);
            } catch (e) {
                sessionStorage.removeItem(storageKey);
                return [];
            }
        }

        function addMessage(text, role, save = true) {
            const messageElement = createMessageElement(text, role);
            chatWindow.appendChild(messageElement);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            if (save) {
                const history = loadHistory();
                history.push({ role, text });
                saveHistory(history);
            }
        }

        function renderHistory(history) {
            history.forEach((item) => {
                addMessage(item.text, item.role, false);
            });
        }

        async function sendQuestion(question) {
            const history = loadHistory();
            addMessage(question, "user");
            status.textContent = "Waiting for reply...";

            const response = await fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question, history }),
            });

            if (!response.ok) {
                const error = await response.json().catch(() => ({}));
                addMessage(error.message || "Unable to get a response.", "assistant");
                status.textContent = "Server error. Check the terminal for details.";
                return;
            }

            const payload = await response.json();
            const answer = payload.answer || "No answer received.";
            addMessage(answer, "assistant");
            status.textContent = "Session memory is stored in your browser tab.";
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const question = questionInput.value.trim();
            if (!question) {
                return;
            }

            questionInput.value = "";
            await sendQuestion(question);
        });

        questionInput.addEventListener("keydown", async (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                form.requestSubmit();
            }
        });

        document.addEventListener("DOMContentLoaded", () => {
            const history = loadHistory();
            renderHistory(history);
        });
    </script>
</body>
</html>
